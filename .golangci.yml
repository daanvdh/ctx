version: "2"

linters:
  settings:
    errcheck:
      # Best-effort writes to the CLI's stdout/stderr and deferred Close
      # calls are intentionally unchecked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
